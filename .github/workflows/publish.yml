name: Publish Package

# Publishes the editor, like overflow-js, to one of two registries:
# - github: GitHub Packages. It only takes the repository owner's scope, so the
#   package goes out as @jaggle-ai-hq/editor, and apps install it under the
#   @jaggle-ai/editor alias (see the package README). Uses the workflow's token.
# - npm: public, as @jaggle-ai/editor. Needs the NPM_TOKEN secret.
# Either way the GitHub release also carries the package as @jaggle-ai/editor
# (jaggle-ai-editor-<version>.tgz), which installs from its URL with no token.
on:
  workflow_dispatch:
    inputs:
      registry:
        description: Where to publish
        required: true
        type: choice
        options:
          - github
          - npm
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      preid:
        description: Pre-release identifier (only used when bump is "prerelease")
        required: false
        type: string
        default: beta

concurrency:
  group: publish-editor
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to ${{ github.event.inputs.registry }}
    runs-on: [self-hosted, jaggle-dev]
    permissions:
      contents: write
      packages: write
    env:
      PACKAGE: ${{ github.event.inputs.registry == 'github' && '@jaggle-ai-hq/editor' || '@jaggle-ai/editor' }}
      REGISTRY: ${{ github.event.inputs.registry == 'github' && 'https://npm.pkg.github.com' || 'https://registry.npmjs.org' }}
      NODE_AUTH_TOKEN: ${{ github.event.inputs.registry == 'github' && secrets.GITHUB_TOKEN || secrets.NPM_TOKEN }}
    steps:
      - name: Check the registry token
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::No token for ${{ github.event.inputs.registry }}: add the NPM_TOKEN repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: ${{ env.REGISTRY }}
          scope: ${{ github.event.inputs.registry == 'github' && '@jaggle-ai-hq' || '' }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        id: version
        run: |
          if [ "${{ github.event.inputs.bump }}" = "prerelease" ]; then
            npm version prerelease --preid=${{ github.event.inputs.preid }} --no-git-tag-version
          else
            npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          fi
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
        working-directory: packages/editor

      - name: Build, lint, typecheck, test
        run: npm run check

      # Published from a copy, so the registry's name never reaches the repository.
      - name: Publish
        run: |
          stage="$RUNNER_TEMP/editor-package"
          rm -rf "$stage" && mkdir -p "$stage"
          cp -R package.json README.md LICENSE LICENSE-shadcn-editor dist "$stage"
          cd "$stage"
          npm pkg set name="$PACKAGE" publishConfig.registry="$REGISTRY"
          if [ "${{ github.event.inputs.registry }}" = "github" ]; then
            # GitHub Packages sets visibility in the package's settings.
            npm pkg delete publishConfig.access
          fi
          if [ "${{ github.event.inputs.bump }}" = "prerelease" ]; then
            npm publish --tag ${{ github.event.inputs.preid }}
          else
            npm publish
          fi
        working-directory: packages/editor

      - name: Pack for the release
        run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: packages/editor

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/editor/package.json package-lock.json
          TAG="$PACKAGE@${{ steps.version.outputs.new_version }}"
          git commit -m "release: $TAG"
          git tag "$TAG"
          git push origin HEAD "$TAG"

      - name: Create GitHub Release
        run: |
          TAG="$PACKAGE@${{ steps.version.outputs.new_version }}"
          ASSET="$RUNNER_TEMP/jaggle-ai-editor-${{ steps.version.outputs.new_version }}.tgz"
          if [ "${{ github.event.inputs.bump }}" = "prerelease" ]; then
            gh release create "$TAG" "$ASSET" --title "$TAG" --generate-notes --prerelease
          else
            gh release create "$TAG" "$ASSET" --title "$TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
